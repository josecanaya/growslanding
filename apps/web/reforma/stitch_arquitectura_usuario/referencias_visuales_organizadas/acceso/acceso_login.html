<div class="flex flex-col items-center mb-10">

<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 ml-1" for="email">Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all" id="email" name="email" placeholder="nombre@ejemplo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block text-sm font-semibold text-slate-700" for="password">Password</label>
<a class="text-xs font-bold text-blue-600 hover:text-blue-700 transition-colors" href="#">Olvidé mi contraseña</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-[0.98] transition-all duration-150" type="submit">
                    Entrar
                </button>
</form>
<!-- Social Login / Divider -->
<div class="mt-8 pt-8 border-t border-slate-100">
<p class="text-center text-slate-500 text-sm mb-6">O continúa con</p>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="minimalist google logo icon on transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAr-9jg8Y7Wqvhoy81gAKEdFV6P93olp-JhUp1-Bqc37GbfYqx-OMU7chyIyIp3KuUbAfnTMUdg3C8cQIzi4HPrKyVZSGDqcveyfTeCPYm9Ogsp0xfEmm8fD6kFqoaS9lrol_xyRM5aoQc7l0Kx4ZuTbHLgU3ZyANds2lYoy-C51kQkIL5V1V7RknML5QpbR1kuM_M6PZRC2AmNLOrq2SiUlH4pKNn34tx2NcIcvmhJf9mUgniVVE0irXIB_FMnHcvm5Lu5tRjkCeOT"/>

<span class="material-symbols-outlined text-slate-900" data-icon="brand_awareness">brand_awareness</span>
<span class="text-sm font-bold text-slate-700">Apple</span>
</button>
</div>
</div>
</div>

<p class="mt-8 text-center text-slate-500 text-sm">
            ¿No tienes una cuenta? 
            <a class="font-bold text-blue-600 hover:text-blue-700 transition-colors" href="#">Crear cuenta</a>
</p>

<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-blue-100/40 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-blue-200/30 blur-[120px] rounded-full"></div>

<div class="absolute inset-0 bg-gradient-to-t from-blue-900/60 to-transparent flex items-end p-12">
<div class="text-white">
<p class="text-lg font-medium opacity-80 mb-2">Construyendo el futuro</p>
<h2 class="text-4xl font-bold leading-tight">La plataforma inteligente para arquitectos.</h2>
</div>
