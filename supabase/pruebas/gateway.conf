# Misma forma de URL que un proyecto Supabase: /auth/v1, /rest/v1, /storage/v1.
server {
  listen 8000;
  client_max_body_size 60m;
  resolver 127.0.0.11 valid=5s;
  location /auth/v1/    { set $u http://auth:9999;    rewrite ^/auth/v1/(.*)$ /$1 break;    proxy_pass $u; proxy_set_header Host $http_host; }
  location /rest/v1/    { set $u http://rest:3000;    rewrite ^/rest/v1/(.*)$ /$1 break;    proxy_pass $u; proxy_set_header Host $http_host; }
  location /storage/v1/ { set $u http://storage:5000; rewrite ^/storage/v1/(.*)$ /$1 break; proxy_pass $u; proxy_set_header Host $http_host; }
  location = /health    { return 200 'grows-pruebas'; }
}
