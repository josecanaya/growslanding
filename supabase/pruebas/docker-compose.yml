# Instancia DEDICADA de pruebas de GROWS: Postgres + Auth (GoTrue) + API (PostgREST) + Storage + gateway.
# Solo escucha en 127.0.0.1. No comparte nada con producción: claves generadas localmente
# (scripts/entorno-pruebas/claves.mjs), sin SMTP, sin OAuth, sin webhooks externos.
name: grows-pruebas
services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    ports: ["127.0.0.1:${PRUEBAS_DB_PORT:-54322}:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=warning"]
    volumes:
      - grows_pruebas_db:/var/lib/postgresql/data
      - ./init/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 40
  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${PRUEBAS_API_PORT:-54321}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:${PRUEBAS_WEB_PORT:-3100}
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:*,http://localhost:*
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Identidades ficticias: se confirman solas y no se envía ningún correo.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ""
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "10000"
      GOTRUE_RATE_LIMIT_VERIFY: "10000"
  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
  storage:
    image: supabase/storage-api:v1.25.7
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy }, rest: { condition: service_started } }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: grows-pruebas
      REGION: local
      GLOBAL_S3_BUCKET: grows-pruebas
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - grows_pruebas_storage:/var/lib/storage
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [auth, rest, storage]
    ports: ["127.0.0.1:${PRUEBAS_API_PORT:-54321}:8000"]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  grows_pruebas_db:
  grows_pruebas_storage:
