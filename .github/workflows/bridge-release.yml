name: Bridge Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bridge-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install project deps
        working-directory: bridge-tauri
        run: npm ci
      - name: Build
        working-directory: bridge-tauri
        run: npm exec tauri build -- ${{ matrix.args }}
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bridge-tauri/src-tauri/target/release/bundle/nsis/*.exe
            bridge-tauri/src-tauri/target/*/release/bundle/nsis/*.exe
            bridge-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            bridge-tauri/src-tauri/target/*/release/bundle/dmg/*.dmg
            bridge-tauri/src-tauri/target/release/bundle/macos/*.app.tar.gz
            bridge-tauri/src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            bridge-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            bridge-tauri/src-tauri/target/*/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
