<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#163274",
                        "secondary": "#43617c",
                        "surface": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "surface-container": "#eceef0",
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
<!-- Header -->
<header class="bg-surface flex justify-between items-center px-6 py-4 sticky top-0 z-50">
<div class="flex items-center gap-3">
<button class="text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-xl font-black tracking-tighter text-primary">SOCIOS</div>
</div>
<span class="font-bold text-[10px] text-primary bg-primary/10 px-2 py-1 rounded">#WPK-45092</span>
</header>
<main class="px-6 pt-2 pb-40">
<!-- Main Info -->
<section class="mb-6">
<h1 class="text-2xl font-extrabold text-primary leading-tight">Instalación Eléctrica Fase II</h1>
<p class="text-sm font-medium text-secondary flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-sm">location_on</span> Altavista - Bloque C
            </p>
</section>
<!-- Tasks List -->
<section class="mb-8">
<div class="space-y-2">
<div class="flex items-center gap-3 p-3 bg-white rounded-lg border border-primary/5 shadow-sm">
<span class="material-symbols-outlined text-primary text-xl">radio_button_unchecked</span>
<span class="text-sm font-bold">Cableado líneas principales</span>
</div>
<div class="flex items-center gap-3 p-3 bg-white rounded-lg border border-primary/5 shadow-sm">
<span class="material-symbols-outlined text-primary text-xl">radio_button_unchecked</span>
<span class="text-sm font-bold">Instalación luminarias LED</span>
</div>
<div class="flex items-center gap-3 p-3 bg-primary/5 rounded-lg opacity-60">
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-sm font-bold line-through">Pruebas de carga inicial</span>
</div>
</div>
</section>
<!-- Primary Action: View Plans -->
<button class="w-full bg-white border-2 border-primary text-primary py-5 rounded-xl font-headline font-extrabold flex items-center justify-center gap-3 mb-4 active:scale-95 transition-transform">
<span class="material-symbols-outlined">architecture</span>
            VER PLANOS
        </button>
</main>
<!-- Fixed Bottom Action: Quote -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-surface/80 backdrop-blur-md">
<button class="w-full bg-primary text-white py-5 rounded-xl font-headline font-extrabold flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-transform">
<span class="material-symbols-outlined">payments</span>
            PRESUPUESTAR
        </button>
</div>
</body></html>
