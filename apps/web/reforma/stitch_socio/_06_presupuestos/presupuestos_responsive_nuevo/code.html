<style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); }
        .status-blade { position: relative; }
        .status-blade::before { content: ''; position: absolute; left: 0; top: 15%; height: 70%; width: 4px; border-radius: 0 4px 4px 0; background-color: #003473; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-slate-50 dark:bg-slate-950 flex justify-between items-center w-full px-6 py-4 z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="professional male construction manager avatar in a studio setting with soft lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDTZyExdRgeC2NCkgTFs7l6uQco6y_PNbHqUzs3eSqTcZWENNah8fxPWgRjTlbVqWqC2drMCt7L5fnoN7UXJKnIfv4xqKDF-g_qCpDXyZCrUhtbfd__x_fx1wFdMqKqtGzQgcN8B-DXTOh-IvomTuP3I0wCnbxBWK8XOll0GTZyQIewJJP3QzuuR9XRbMXCDA13CNIe2YLbpmFyroGZGn2FaqvJnGsO90joLtzgTdKOV0OrAtpSHPeQjXk-vUwmXgatjoYdPyOBT3dH"/>
</div>
<div>
<p class="text-[0.75rem] font-medium font-label tracking-wider uppercase text-slate-500">Socio de Obra</p>
<h1 class="text-xl font-black tracking-tight text-blue-900 dark:text-blue-100">GROWS</h1>
</div>
</div>
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-95">
<span class="material-symbols-outlined text-blue-900 dark:text-blue-400">notifications</span>
</button>
</div>
</header>
<!-- Content Canvas -->
<main class="flex-1 px-6 pt-4 pb-28 max-w-2xl mx-auto w-full">
<div class="mb-6">
<h2 class="text-2xl font-extrabold text-primary tracking-tight">Nuevo Presupuesto</h2>
<p class="text-on-surface-variant text-sm font-body">Define los términos del servicio rápidamente.</p>
</div>
<!-- Bento Grid Form -->
<div class="grid grid-cols-1 gap-6">
<!-- 1. Time Selector -->
<section class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_12px_32px_-4px_rgba(22,50,116,0.06)]">
<label class="block text-[0.75rem] font-bold text-primary mb-4 tracking-wider uppercase">Tiempo estimado</label>
<div class="grid grid-cols-4 gap-3">
<button class="flex flex-col items-center justify-center py-4 rounded-xl bg-surface-container-low hover:bg-secondary-container transition-all active:scale-95 group">
<span class="text-lg font-bold text-primary group-hover:text-on-secondary-container">2h</span>
<span class="text-[10px] text-slate-500 group-hover:text-on-secondary-container">Express</span>
</button>
<button class="flex flex-col items-center justify-center py-4 rounded-xl bg-primary text-on-primary ring-4 ring-primary-fixed shadow-lg transition-all active:scale-95">
<span class="text-lg font-bold">4h</span>
<span class="text-[10px] opacity-80 uppercase tracking-tighter">Medio</span>
</button>
<button class="flex flex-col items-center justify-center py-4 rounded-xl bg-surface-container-low hover:bg-secondary-container transition-all active:scale-95 group">
<span class="text-lg font-bold text-primary group-hover:text-on-secondary-container">8h</span>
<span class="text-[10px] text-slate-500 group-hover:text-on-secondary-container">Jornada</span>
</button>
<button class="flex flex-col items-center justify-center py-4 rounded-xl bg-surface-container-low hover:bg-secondary-container transition-all active:scale-95 group">
<span class="text-lg font-bold text-primary group-hover:text-on-secondary-container">12h</span>
<span class="text-[10px] text-slate-500 group-hover:text-on-secondary-container">Intenso</span>
</button>
</div>
</section>
<!-- 2. Amount Input -->
<section class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_12px_32px_-4px_rgba(22,50,116,0.06)]">
<label class="block text-[0.75rem] font-bold text-primary mb-3 tracking-wider uppercase">Monto total (AR$)</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-3xl font-extrabold text-slate-400 tracking-tighter">$</span>
<input class="w-full pl-10 pr-4 py-4 text-4xl font-black tracking-tight bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary focus:bg-white transition-all text-primary placeholder:text-slate-300" placeholder="0.00" type="number"/>
</div>
</section>
<!-- 3. Observations -->
<section class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_12px_32px_-4px_rgba(22,50,116,0.06)]">
<label class="block text-[0.75rem] font-bold text-primary mb-3 tracking-wider uppercase">Observaciones</label>
<input class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary transition-all text-on-surface" placeholder="Ej: Incluye retiro de escombros..." type="text"/>
</section>
<!-- 4. Automatic Summary Card -->
<section class="status-blade bg-primary-container/10 border border-primary-container/20 rounded-xl p-6 flex justify-between items-center overflow-hidden relative">
<div class="space-y-1">
<h4 class="text-xs font-bold text-primary uppercase tracking-widest">Resumen Automático</h4>
<p class="text-sm text-primary/80 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">local_shipping</span>
                        Logística y Cargas incluidas
                    </p>
</div>
<div class="text-right">
<p class="text-[10px] uppercase font-bold text-primary opacity-60">Total Final</p>
<p class="text-2xl font-black text-primary tracking-tight">$0.00</p>
</div>
<!-- Glass accent decoration -->
<div class="absolute -right-10 -bottom-10 w-24 h-24 rounded-full bg-primary/5 blur-2xl"></div>
</section>
<!-- 5. CTA -->
<div class="mt-2">
<button class="w-full py-6 rounded-2xl bg-gradient-to-br from-[#10b981] to-[#059669] text-white shadow-[0_8px_24px_rgba(16,185,129,0.3)] hover:shadow-[0_12px_32px_rgba(16,185,129,0.4)] hover:-translate-y-0.5 active:scale-95 transition-all flex items-center justify-center gap-3">
<span class="text-xl font-extrabold uppercase tracking-widest font-headline">ENVIAR PRESUPUESTO</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-white/85 dark:bg-slate-900/85 backdrop-blur-xl border-t border-slate-200/50 dark:border-slate-800/50 shadow-[0_-4px_20px_rgba(22,50,116,0.08)] rounded-t-lg">
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-3 py-1.5 hover:text-blue-700" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium uppercase tracking-wider mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-3 py-1.5 hover:text-blue-700" href="#">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="text-[10px] font-medium uppercase tracking-wider mt-1">Billetera</span>
</a>
<a class="flex flex-col items-center justify-center bg-blue-50 dark:bg-blue-900/40 text-blue-900 dark:text-blue-100 rounded-xl px-3 py-1.5 scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="text-[10px] font-medium uppercase tracking-wider mt-1">INICIO</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-3 py-1.5 hover:text-blue-700" href="#">
<span class="material-symbols-outlined">analytics</span>
<span class="text-[10px] font-medium uppercase tracking-wider mt-1">Oportunidades</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-3 py-1.5 hover:text-blue-700" href="#">
<span class="material-symbols-outlined">menu</span>
<span class="text-[10px] font-medium uppercase tracking-wider mt-1">Más</span>
</a>
</nav>
</body></html>
