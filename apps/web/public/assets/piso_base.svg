<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo principal del piso (rectángulo isométrico) -->
  <defs>
    <linearGradient id="pisoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Cara superior del piso (rectángulo principal) -->
  <rect x="0" y="0" width="400" height="100" fill="url(#pisoGradient)" stroke="#9ca3af" stroke-width="2" filter="url(#shadow)" rx="4"/>
  
  <!-- Cara frontal del piso (simula profundidad) -->
  <polygon points="400,100 400,120 0,120 0,100" fill="#cbd5e1" opacity="0.8"/>
  
  <!-- Cara lateral del piso (simula profundidad) -->
  <polygon points="400,100 400,120 420,110 420,90" fill="#94a3b8" opacity="0.6"/>
  
  <!-- Líneas arquitectónicas de detalle (fachada) -->
  <line x1="20" y1="10" x2="20" y2="90" stroke="#9ca3af" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="10" x2="50" y2="90" stroke="#9ca3af" stroke-width="1" opacity="0.3"/>
  <line x1="380" y1="10" x2="380" y2="90" stroke="#9ca3af" stroke-width="1" opacity="0.4"/>
  <line x1="350" y1="10" x2="350" y2="90" stroke="#9ca3af" stroke-width="1" opacity="0.3"/>
  
  <!-- Líneas horizontales de detalle -->
  <line x1="10" y1="30" x2="390" y2="30" stroke="#9ca3af" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="10" y1="60" x2="390" y2="60" stroke="#9ca3af" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4"/>
  
  <!-- Borde superior con brillo -->
  <rect x="0" y="0" width="400" height="3" fill="rgba(255,255,255,0.5)"/>
  
  <!-- Borde izquierdo con sombra -->
  <rect x="0" y="0" width="3" height="100" fill="rgba(0,0,0,0.1)"/>
</svg>

