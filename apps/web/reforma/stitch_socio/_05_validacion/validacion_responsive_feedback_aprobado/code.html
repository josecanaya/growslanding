<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#f7f9fb] dark:bg-[#0a0c10] flex justify-between items-center px-6 py-4 w-full docked full-width top-0 sticky z-50">
<div class="flex items-center gap-4">

<h1 class="font-['Manrope'] font-bold tracking-tight text-lg text-[#163274] dark:text-[#314a8d]">Detalle de Tarea</h1>
</div>
<button class="hover:bg-[#e6e8ea] dark:hover:bg-[#2a2c2e] transition-colors scale-95 active:opacity-80 duration-200 p-2 rounded-full">

<main class="flex-grow flex items-center justify-center px-6 md:px-24 py-12">
<div class="w-full max-w-md text-center">

<div class="relative inline-block mb-10">

<div class="absolute inset-0 bg-tertiary/10 blur-3xl rounded-full scale-150"></div>

<div class="relative bg-surface-container-lowest w-32 h-32 md:w-40 md:h-40 rounded-full flex items-center justify-center shadow-[0_12px_32px_-4px_rgba(22,50,116,0.08)]">
<div class="w-24 h-24 md:w-32 md:h-32 bg-surface-container-low rounded-full flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-tertiary text-6xl md:text-8xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Content Hierarchy -->
<div class="space-y-4">
<h2 class="text-4xl md:text-5xl font-extrabold text-primary tracking-tight font-headline">Aprobado</h2>
<p class="text-lg text-on-surface-variant font-body leading-relaxed max-w-xs mx-auto">
                    Instalación eléctrica aprobada
                </p>
</div>
<!-- Operational Blueprint Card (Editorial Metadata) -->
<div class="mt-12 bg-surface-container-low rounded-xl p-6 text-left border-l-4 border-tertiary shadow-sm">
<span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-[0.15em] font-label block mb-3">Resumen de Inspección</span>
<div class="flex items-center gap-4 mb-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-lowest flex items-center justify-center">
<span class="material-symbols-outlined text-primary">bolt</span>
</div>
<div>
<p class="text-xs text-on-surface-variant font-medium">Sistema</p>
<p class="text-sm font-bold text-primary">Red de Alta Tensión</p>
</div>
</div>
<div class="flex justify-between items-center text-xs text-on-surface-variant pt-4 border-t border-outline-variant/15">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">calendar_today</span> 24 Oct, 2023</span>
<span class="flex items-center gap-1 font-bold text-tertiary uppercase tracking-wider"><span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified</span> Certificado</span>

</div>

<button class="w-full py-4 px-8 rounded-xl bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-lg shadow-[0_12px_24px_-4px_rgba(22,50,116,0.2)] hover:-translate-y-0.5 active:scale-95 transition-all duration-200">
                    Ver trabajo
                </button>
<button class="mt-4 w-full py-3 px-8 text-primary font-bold hover:bg-surface-container-low rounded-xl transition-colors">
                    Finalizar jornada
                </button>
</div>

<span class="material-symbols-outlined mb-1">architecture</span>
