# Misma forma de URL que un proyecto Supabase: /auth/v1, /rest/v1, /storage/v1.
# El gateway responde CORS (como hace Kong en Supabase) para que el navegador pueda iniciar sesión contra Auth.
map $http_origin $cors_origin {
  default "";
  "~^http://(127\.0\.0\.1|localhost)(:\d+)?$" $http_origin;
}
server {
  listen 8000;
  client_max_body_size 60m;
  resolver 127.0.0.11 valid=5s;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Expose-Headers;
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer, range, accept-profile, content-profile, x-upsert" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range, x-total-count" always;
  add_header Vary Origin always;

  location /auth/v1/    { if ($request_method = OPTIONS) { return 204; } set $u http://auth:9999;    rewrite ^/auth/v1/(.*)$ /$1 break;    proxy_pass $u; proxy_set_header Host $http_host; }
  location /rest/v1/    { if ($request_method = OPTIONS) { return 204; } set $u http://rest:3000;    rewrite ^/rest/v1/(.*)$ /$1 break;    proxy_pass $u; proxy_set_header Host $http_host; }
  location /storage/v1/ { if ($request_method = OPTIONS) { return 204; } set $u http://storage:5000; rewrite ^/storage/v1/(.*)$ /$1 break; proxy_pass $u; proxy_set_header Host $http_host; }
  location = /health    { return 200 'grows-pruebas'; }
}
