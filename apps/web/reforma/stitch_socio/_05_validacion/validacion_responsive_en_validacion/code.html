<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#163274",
                    "primary-container": "#314a8d",
                    "surface": "#f7f9fb",
                    "on-surface": "#191c1e",
                    "on-surface-variant": "#434653",
                    "outline-variant": "#c3c6d5",
                    "surface-container-low": "#f2f4f6",
                    "surface-container": "#eceef0",
                    "surface-container-highest": "#e0e3e5",
                    "primary-fixed": "#dbe1ff"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            min-height: 100dvh;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-white/80 backdrop-blur-md">
<div class="flex justify-between items-center w-full px-6 py-4">
<div class="flex items-center gap-4">
<button class="p-2 rounded-lg">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</button>
<h1 class="text-primary font-headline font-extrabold tracking-widest uppercase text-sm">CONSTRUCCIÓN</h1>
</div>
<button class="p-2 rounded-lg">
<span class="material-symbols-outlined text-primary" data-icon="account_circle">account_circle</span>
</button>
</div>
<div class="bg-outline-variant/30 h-[1px] w-full"></div>
</header>
<main class="max-w-md mx-auto px-6 py-12 flex flex-col items-center text-center">
<!-- Radical Simplification: Core Status Only -->
<div class="w-full space-y-12">
<div class="flex flex-col items-center gap-6">
<div class="w-24 h-24 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="sync">sync</span>
</div>
<div>
<h2 class="text-primary font-headline font-extrabold text-3xl tracking-tight">Cierre en Validación</h2>
<p class="text-on-surface-variant font-medium mt-2">Bloque estructural 12-B</p>
</div>
</div>
<!-- Clear Status Indicator -->
<div class="bg-primary/5 border border-primary/10 rounded-2xl p-6 flex flex-col items-center gap-3">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="schedule" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-headline font-bold text-lg tracking-wide uppercase">EN REVISIÓN</span>
</div>
<p class="text-sm text-on-surface-variant">El sistema está validando la información enviada.</p>
</div>
<div class="space-y-4">
<button class="w-full bg-primary text-white font-headline font-bold py-5 rounded-xl shadow-lg active:scale-95 transition-transform">
                    REGRESAR AL INICIO
                </button>
<p class="text-xs text-outline font-medium uppercase tracking-widest">Azul Operativo v2.0</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pt-2 pb-8 bg-white/90 backdrop-blur-xl border-t border-outline-variant/30 md:hidden">
<a class="flex flex-col items-center justify-center text-outline px-3 py-1.5" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[10px] font-bold uppercase mt-1">Inicio</span>
</a>
<a class="flex flex-col items-center justify-center text-primary px-3 py-1.5 bg-primary/5 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="text-[10px] font-bold uppercase mt-1">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-outline px-3 py-1.5" href="#">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
<span class="text-[10px] font-bold uppercase mt-1">Más</span>
</a>
</nav>
</body></html>
