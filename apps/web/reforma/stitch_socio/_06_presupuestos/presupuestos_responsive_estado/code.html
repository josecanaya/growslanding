<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-xl border-b border-surface-container-high h-16 flex justify-between items-center px-6">
<div class="flex items-center gap-4">

<h1 class="text-lg font-black text-primary tracking-tighter font-headline uppercase">AZUL OPERATIVO</h1>
</div>
<button class="material-symbols-outlined text-primary p-2" data-icon="more_vert">more_vert</button>
</header>
<main class="flex-grow pt-24 pb-12 px-6 max-w-md mx-auto w-full flex flex-col items-center justify-center">
<!-- Radical Focus Container -->
<div class="w-full text-center space-y-12">
<!-- Reference Info (Minimal) -->
<div class="space-y-1">
<p class="font-label text-xs font-bold uppercase tracking-[0.2em] text-secondary">Referencia de Obra</p>
<h2 class="font-headline text-2xl font-extrabold text-on-surface">#AZ-99201</h2>
</div>

<div class="w-28 h-28 rounded-full bg-success flex items-center justify-center text-white shadow-lg shadow-success/30">
<span class="material-symbols-outlined text-[4rem]" data-icon="check_circle">check_circle</span>
</div>
<div class="space-y-3">
<span class="block font-label text-[0.75rem] font-black uppercase tracking-[0.3em] text-success">Estado del Presupuesto</span>
<h3 class="font-headline text-5xl font-black text-success uppercase tracking-tighter">APROBADO</h3>
</div>
<p class="text-success/80 font-medium text-sm">
                    Confirmado el 15 de Oct, 2023
                </p>
</div>
<!-- Single Main Action -->
<div class="flex flex-col gap-4 w-full">
<button class="bg-primary text-white w-full py-6 rounded-3xl font-black text-xl shadow-xl shadow-primary/30 flex items-center justify-center gap-3 active:scale-[0.98] transition-transform uppercase tracking-wider">
                    VOLVER AL LISTADO
                </button>
<button class="w-full py-4 text-primary font-bold hover:bg-surface-container rounded-2xl transition-colors">
                    Ver Detalles del Presupuesto
                </button>
