<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "on-surface": "#191c1e",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#b3c5ff",
                    "surface": "#f7f9fb",
                    "on-secondary-container": "#46647e",
                    "primary-container": "#314a8d",
                    "primary": "#163274",
                    "surface-dim": "#d8dadc",
                    "tertiary-fixed-dim": "#adc7ff",
                    "outline-variant": "#c3c6d5",
                    "secondary-container": "#c1e0ff",
                    "inverse-surface": "#2d3133",
                    "secondary": "#43617c",
                    "secondary-fixed-dim": "#abcae8",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed": "#001a41",
                    "on-secondary-fixed-variant": "#2b4963",
                    "surface-container-highest": "#e0e3e5",
                    "on-tertiary-fixed-variant": "#004493",
                    "surface-container-high": "#e6e8ea",
                    "on-tertiary-container": "#9fbeff",
                    "on-primary-fixed": "#00174a",
                    "tertiary": "#003473",
                    "primary-fixed": "#dbe1ff",
                    "error-container": "#ffdad6",
                    "error": "#ba1a1a",
                    "background": "#f7f9fb",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#eceef0",
                    "secondary-fixed": "#cce5ff",
                    "outline": "#737784",
                    "surface-variant": "#e0e3e5",
                    "on-error": "#ffffff",
                    "on-primary-container": "#a8bcff",
                    "surface-container-low": "#f2f4f6",
                    "inverse-on-surface": "#eff1f3",
                    "on-secondary-fixed": "#001d31",
                    "tertiary-container": "#004a9f",
                    "primary-fixed-dim": "#b3c5ff",
                    "on-surface-variant": "#434653",
                    "on-primary-fixed-variant": "#2a4386",
                    "tertiary-fixed": "#d8e2ff",
                    "on-primary": "#ffffff",
                    "surface-tint": "#435b9f",
                    "surface-bright": "#f7f9fb",
                    "on-background": "#191c1e"
            },
            "borderRadius": {
                    "DEFAULT": "0.5rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-step-gradient {
            background: linear-gradient(135deg, #163274 0%, #314a8d 100%);
        }
        @keyframes soft-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-soft-pulse {
            animation: soft-pulse 3s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar with Progress Bar -->
<header class="bg-surface/90 backdrop-blur-md w-full fixed top-0 z-50">
<div class="flex items-center w-full px-6 py-4">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-lg tracking-tight text-primary">Preparación de Terreno</h1>
</div>
</div>
<!-- Thin Progress Bar -->
<div class="w-full h-1 bg-surface-container">
<div class="h-full bg-primary w-2/5 transition-all duration-500 ease-out"></div>
</div>
<div class="px-6 py-1">
<span class="text-[10px] font-bold text-secondary uppercase tracking-[0.1em]">Paso 2 de 5</span>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-32">
<div class="w-full max-w-md flex flex-col items-center text-center">
<!-- Central Icon Card -->
<div class="relative w-full aspect-square max-w-[240px] mb-6 animate-soft-pulse">
<div class="absolute inset-0 bg-primary/5 rounded-[2.5rem] blur-xl translate-y-4"></div>
<div class="relative h-full w-full bg-surface-container-lowest rounded-[2.5rem] flex flex-col items-center justify-center shadow-[0_8px_24px_-4px_rgba(22,50,116,0.12)] border border-white">
<span class="material-symbols-outlined text-[80px] text-primary" data-icon="construction" style="font-variation-settings: 'FILL' 1;">construction</span>
<div class="flex gap-1.5 mt-6">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-primary/20"></div>
<div class="w-2 h-2 rounded-full bg-primary/20"></div>
</div>
</div>
</div>
<!-- Content Hierarchy -->
<div class="space-y-1">
<h2 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface">Preparar mezcla</h2>
<p class="text-on-surface-variant text-sm font-medium">Confirmá para continuar</p>
</div>
</div>
</main>
<!-- Bottom Actions Layer -->
<section class="fixed bottom-0 left-0 w-full p-6 bg-surface/80 backdrop-blur-xl border-t border-outline-variant/20">
<div class="max-w-md mx-auto w-full flex flex-col gap-3">
<!-- Primary Action -->
<button class="w-full h-16 bg-step-gradient text-on-primary font-headline font-bold text-lg rounded-xl shadow-[0_12px_24px_-8px_rgba(22,50,116,0.5)] active:shadow-[0_4px_12px_-4px_rgba(22,50,116,0.3)] active:translate-y-[1px] active:scale-[0.98] transition-all duration-200 uppercase tracking-wide">
                YA LO HICE
            </button>
<!-- Secondary Action -->
<button class="w-full py-3 text-secondary font-label font-semibold hover:bg-surface-container-low rounded-lg transition-colors active:scale-95 duration-150">
                Volver
            </button>
</div>
</section>
<!-- Decorative status blade -->
<div class="fixed left-0 top-1/2 -translate-y-1/2 w-1 h-24 bg-primary/40 rounded-r-full"></div>
</body></html>
