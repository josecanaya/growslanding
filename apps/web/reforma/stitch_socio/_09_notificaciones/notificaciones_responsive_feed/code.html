<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#00174a",
                        "surface-tint": "#435b9f",
                        "inverse-primary": "#b3c5ff",
                        "surface-dim": "#d8dadc",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-fixed-variant": "#2a4386",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#004a9f",
                        "surface": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#434653",
                        "inverse-on-surface": "#eff1f3",
                        "secondary": "#43617c",
                        "on-background": "#191c1e",
                        "secondary-fixed-dim": "#abcae8",
                        "outline": "#737784",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-container": "#46647e",
                        "primary-fixed": "#dbe1ff",
                        "tertiary-fixed": "#d8e2ff",
                        "surface-container": "#eceef0",
                        "on-primary-container": "#a8bcff",
                        "tertiary": "#003473",
                        "secondary-container": "#c1e0ff",
                        "outline-variant": "#c3c6d5",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#cce5ff",
                        "surface-bright": "#f7f9fb",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed-variant": "#004493",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary-fixed-variant": "#2b4963",
                        "on-secondary-fixed": "#001d31",
                        "background": "#f7f9fb",
                        "on-tertiary-fixed": "#001a41",
                        "error": "#ba1a1a",
                        "primary-container": "#314a8d",
                        "on-surface": "#191c1e",
                        "on-tertiary-container": "#9fbeff",
                        "tertiary-fixed-dim": "#adc7ff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#163274",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "primary-fixed-dim": "#b3c5ff",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .status-blade-success { border-left: 4px solid #163274; }
        .status-blade-warning { border-left: 4px solid #ba1a1a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
<header class="bg-white w-full top-0 sticky z-50">
<div class="flex justify-between items-center w-full px-6 py-4">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
<span class="text-primary font-extrabold tracking-widest uppercase font-headline">CONSTRUCCIÓN</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="account_circle">account_circle</span>
</div>
</div>
<div class="bg-surface-container-highest h-[1px] w-full"></div>
</header>
<main class="max-w-3xl mx-auto px-6 py-8">
<section class="mb-6">
<h1 class="text-xl font-extrabold text-primary font-headline tracking-tight">Notificaciones</h1>
</section>
<div class="space-y-3">
<div class="surface-container-lowest glass-card rounded-lg p-4 flex items-center justify-between shadow-sm status-blade-success">
<p class="font-body font-semibold text-sm text-on-surface">Presupuesto aprobado</p>
<span class="text-[0.65rem] font-bold text-primary uppercase">Ahora</span>
</div>
<div class="surface-container-lowest glass-card rounded-lg p-4 flex items-center justify-between shadow-sm status-blade-warning">
<p class="font-body font-semibold text-sm text-on-surface">Corrección solicitada</p>
<span class="text-[0.65rem] font-bold text-outline uppercase">10:45 AM</span>
</div>
<div class="surface-container-lowest glass-card rounded-lg p-4 flex items-center justify-between shadow-sm status-blade-success">
<p class="font-body font-semibold text-sm text-on-surface">Tarea asignada</p>
<span class="text-[0.65rem] font-bold text-outline uppercase">09:12 AM</span>
</div>
</div>
</main>
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pt-2 pb-6 bg-white/95 backdrop-blur-md border-t border-surface-container">
<div class="flex flex-col items-center justify-center text-outline px-3 py-1.5">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-inter text-[9px] font-bold uppercase mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-outline px-3 py-1.5">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-inter text-[9px] font-bold uppercase mt-1">Wallet</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary/10 text-primary rounded-xl px-4 py-1.5">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-inter text-[9px] font-bold uppercase mt-1">Inicio</span>
</div>
<div class="flex flex-col items-center justify-center text-outline px-3 py-1.5">
<span class="material-symbols-outlined" data-icon="precision_manufacturing">precision_manufacturing</span>
<span class="font-inter text-[9px] font-bold uppercase mt-1">Obras</span>
</div>
<div class="flex flex-col items-center justify-center text-outline px-3 py-1.5">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
<span class="font-inter text-[9px] font-bold uppercase mt-1">Más</span>
</div>
</nav>
</body></html>
