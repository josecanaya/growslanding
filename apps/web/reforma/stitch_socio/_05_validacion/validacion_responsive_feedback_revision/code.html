<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-surface": "#2d3133",
                    "error": "#ba1a1a",
                    "on-surface-variant": "#434653",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-container": "#004a9f",
                    "surface-container-highest": "#e0e3e5",
                    "on-primary-fixed-variant": "#2a4386",
                    "surface-bright": "#f7f9fb",
                    "primary-fixed-dim": "#b3c5ff",
                    "error-container": "#ffdad6",
                    "secondary": "#43617c",
                    "on-tertiary-fixed": "#001a41",
                    "primary-fixed": "#dbe1ff",
                    "outline-variant": "#c3c6d5",
                    "tertiary-fixed-dim": "#adc7ff",
                    "surface-container-high": "#e6e8ea",
                    "outline": "#737784",
                    "on-secondary-fixed-variant": "#2b4963",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-container": "#9fbeff",
                    "inverse-on-surface": "#eff1f3",
                    "surface-container": "#eceef0",
                    "on-secondary": "#ffffff",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#b3c5ff",
                    "secondary-container": "#c1e0ff",
                    "primary": "#163274",
                    "on-secondary-fixed": "#001d31",
                    "surface-dim": "#d8dadc",
                    "on-background": "#191c1e",
                    "surface-container-low": "#f2f4f6",
                    "surface": "#f7f9fb",
                    "on-secondary-container": "#46647e",
                    "secondary-fixed": "#cce5ff",
                    "background": "#f7f9fb",
                    "on-primary-fixed": "#00174a",
                    "tertiary": "#003473",
                    "tertiary-fixed": "#d8e2ff",
                    "surface-tint": "#435b9f",
                    "on-tertiary-fixed-variant": "#004493",
                    "on-error-container": "#93000a",
                    "surface-variant": "#e0e3e5",
                    "primary-container": "#314a8d",
                    "on-primary-container": "#a8bcff",
                    "on-error": "#ffffff",
                    "secondary-fixed-dim": "#abcae8",
                    "on-surface": "#191c1e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#f7f9fb] dark:bg-[#0a0c10] docked full-width top-0 sticky z-50 flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-[#163274] dark:text-[#314a8d] hover:bg-[#e6e8ea] dark:hover:bg-[#2a2c2e] transition-colors p-2 rounded-full active:opacity-80 scale-95 duration-200">
                arrow_back
            </button>
<h1 class="font-['Manrope'] font-bold tracking-tight text-lg text-[#163274] dark:text-[#314a8d]">Detalle de Tarea</h1>
</div>
<button class="material-symbols-outlined text-[#163274] dark:text-[#314a8d] hover:bg-[#e6e8ea] dark:hover:bg-[#2a2c2e] transition-colors p-2 rounded-full active:opacity-80 scale-95 duration-200">
            more_vert
        </button>
</header>
<!-- Main Content: Focused Review Screen -->
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 max-w-lg mx-auto w-full">
<!-- Illustration/Icon Section -->
<div class="relative mb-10">
<div class="absolute inset-0 bg-error/5 rounded-full scale-150 blur-3xl"></div>
<div class="relative bg-surface-container-lowest rounded-full p-8 shadow-sm">
<span class="material-symbols-outlined text-[80px] text-error" style="font-variation-settings: 'FILL' 1;">
                    warning
                </span>
</div>
</div>
<!-- Textual Feedback -->
<div class="text-center space-y-3 mb-12">
<h2 class="text-3xl font-extrabold tracking-tight text-on-surface">Revisión necesaria</h2>
<p class="text-on-surface-variant font-medium text-lg leading-relaxed">
                Instalación eléctrica con observaciones
            </p>
</div>
<!-- Content Canvas (Detail Card) -->
<div class="w-full bg-surface-container-low rounded-xl p-6 mb-12 relative overflow-hidden">
<!-- Status Blade -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-error"></div>
<div class="space-y-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 20px;">info</span>
<span class="text-xs font-bold font-label uppercase tracking-widest text-on-surface-variant">Detalles de Validación</span>
</div>
<div class="space-y-3">
<div class="flex justify-between items-center py-2">
<span class="text-on-surface-variant text-sm">Punto de Control</span>
<span class="text-on-surface font-semibold text-sm">Circuito de Carga 04</span>
</div>
<div class="flex justify-between items-center py-2">
<span class="text-on-surface-variant text-sm">Inconsistencia</span>
<span class="text-error font-semibold text-sm">Sobretensión detectada</span>
</div>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="w-full space-y-4">
<button class="w-full py-4 px-8 rounded-xl bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-lg shadow-lg shadow-primary/10 hover:-translate-y-0.5 active:scale-95 transition-all duration-200 flex items-center justify-center gap-3">
<span class="material-symbols-outlined">refresh</span>
                Volver a ejecutar
            </button>
<button class="w-full py-3 px-8 text-primary font-bold hover:bg-surface-container-high rounded-xl transition-colors">
                Descargar informe de errores
            </button>
</div>
</main>
<!-- Shell Navigation suppressed as per UX Goal for transactional/error focus -->
<!-- However, providing a minimal breadcrumb or back link if necessary is handled by the TopAppBar -->
<!-- Decorative Bottom Spacer to balance whitespace -->
<div class="h-24 md:hidden"></div>
</body></html>
